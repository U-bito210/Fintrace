[pytest]
# Default `pytest -q` runs ONLY offline/mocked tests — no real API calls, no cost.
# Live provider/LLM integration tests are marked `integration` and require
# explicit opt-in plus the corresponding credentials.
# To guarantee zero cost even when a key is present:
#   pytest -q -m "not integration"
markers =
    integration: live provider or LLM tests that require explicit opt-in and credentials

asyncio_mode = strict

# The repository keeps ignored runtime artifacts under ``tmp/``.  They may be
# ACL-protected after a local Streamlit or benchmark run, so discovery must stay
# within the maintained test suite instead of recursively scanning the project.
testpaths = tests

# ``conftest.py`` assigns a fresh ignored tmp/ leaf for every ordinary run.
# A fixed ``--basetemp`` is unsafe on Windows: a previous Streamlit or pytest
# process can leave an ACL-protected child that pytest must delete before it
# can start.  Callers can still pass ``--basetemp`` explicitly when required.
